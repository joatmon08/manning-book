name: Continuous Delivery Example

on:
  push:
    branches: [ main ]
    paths:
      - 'ch07/**'
      - '.github/workflows/pipeline.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ch07/**'
      - '.github/workflows/pipeline.yml'

defaults:
  run:
    working-directory: ch07/s01

jobs:
  unit-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version-file: .python-version
    - name: Install dependencies
      working-directory: .
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with autopep8
      run: |
        autopep8 -r -d --exit-code . 
    - name: Run unit tests
      run: |
        pytest -m unit

  integration-tests:
    environment: testing
    needs: [unit-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - uses: google-github-actions/auth@v3
      id: auth
      with:
        workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_POOL_PROVIDER }}
        service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
        project_id: ${{ secrets.CLOUDSDK_CORE_PROJECT }}
        token_format: 'access_token'
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version-file: .python-version
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.15.9
        terraform_wrapper: false
    - name: Install dependencies
      working-directory: .
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run integration tests against testing environment
      env:
        CLOUDSDK_CORE_PROJECT: ${{ secrets.CLOUDSDK_CORE_PROJECT }}
        GOOGLE_REGION: ${{ secrets.GOOGLE_REGION }}
        GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
      run: |
        pytest -m integration --environment=test -vvv
