name: Continuous Delivery Example

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

defaults:
  run:
    working-directory: ch07/s01

jobs:
  unit-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.9
      uses: actions/setup-python@v7
      with:
        python-version: 3.9
    - name: Install dependencies
      working-directory: .
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with autopep8
      run: |
        autopep8 -r -d --exit-code . 
    - name: Run unit tests
      run: |
        pytest -m unit

  oidc-check:
    environment: testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_POOL_PROVIDER }}
        service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
        project_id: ${{ secrets.CLOUDSDK_CORE_PROJECT }}
    - uses: google-github-actions/setup-gcloud@v3
    - name: Verify Workload Identity Federation
      working-directory: .
      run: |
        ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
        echo "authenticated as ${ACCOUNT}"
        test -n "${ACCOUNT}"
        gcloud auth print-access-token >/dev/null

  integration-tests:
    environment: testing
    needs: [unit-test, oidc-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_POOL_PROVIDER }}
        service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
        project_id: ${{ secrets.CLOUDSDK_CORE_PROJECT }}
    - name: Set up Python 3.9
      uses: actions/setup-python@v7
      with:
        python-version: 3.9
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.15.8
        terraform_wrapper: false
    - name: Install dependencies
      working-directory: .
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run integration tests against testing environment
      env:
        CLOUDSDK_CORE_PROJECT: ${{ secrets.CLOUDSDK_CORE_PROJECT }}
        GOOGLE_REGION: ${{ secrets.GOOGLE_REGION }}
      run: |
        pytest -m integration --environment=test
